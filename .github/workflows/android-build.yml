name: JammerDetector Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  P4A_COLOR: "1"
  P4A_NO_INTERACTIVE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROIDSDK: /usr/local/lib/android/sdk
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
  ANDROIDNDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
  ANDROIDAPI: "35"
  ANDROIDMINAPI: "24"
  NDKAPI: "24"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
  MAKEFLAGS: "-j2"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer and Android build state
        uses: actions/cache@v4
        with:
          path: |
            android_app/.buildozer
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-api35-py311-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-api35-py311-
            ${{ runner.os }}-buildozer-api35-
            ${{ runner.os }}-buildozer-

      - name: Install Android build dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config libffi-dev libssl-dev zlib1g-dev libltdl-dev libncurses5-dev libncursesw5-dev

      - name: Prepare Android SDK compatibility
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROIDSDK"
          test -d "$ANDROIDNDK"
          test -d "$ANDROIDSDK/platforms/android-35"
          test -d "$ANDROIDSDK/build-tools/35.0.0" || test -d "$ANDROIDSDK/build-tools/37.0.0"
          sudo mkdir -p "$ANDROIDSDK/tools/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' | sudo tee "$ANDROIDSDK/tools/bin/sdkmanager" >/dev/null
          sudo chmod +x "$ANDROIDSDK/tools/bin/sdkmanager"
          test -x "$ANDROIDSDK/tools/bin/sdkmanager"

      - name: Install Buildozer
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Verify toolchain
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python --version
          java -version
          buildozer --version
          test -f android_app/buildozer.spec
          "$ANDROIDSDK/tools/bin/sdkmanager" --version
          "$ANDROIDNDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -n 1

      - name: Build debug APK
        shell: bash
        timeout-minutes: 165
        run: |
          set -euo pipefail
          echo "Starting Buildozer with maximum verbosity (log_level=3)..."
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Locate APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          find android_app/bin -type f -name '*.apk' -print
          test -n "$(find android_app/bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JammerDetector-Android-APK
          path: |
            android_app/bin/*.apk
            android_app/buildozer-build.log
          if-no-files-found: error
          retention-days: 14