name: JammerDetector Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: jammerdetector-android-build-v2
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  P4A_COLOR: "1"
  P4A_NO_INTERACTIVE: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  ANDROID_HOME: ${{ github.workspace }}/android_app/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android_app/.buildozer/android/platform/android-sdk
  ANDROIDSDK: ${{ github.workspace }}/android_app/.buildozer/android/platform/android-sdk
  ANDROID_NDK_ROOT: ${{ github.workspace }}/android_app/.buildozer/android/platform/android-sdk/ndk
  ANDROIDNDK: ${{ github.workspace }}/android_app/.buildozer/android/platform/android-sdk/ndk
  ANDROIDAPI: "35"
  ANDROIDMINAPI: "24"
  NDKAPI: "24"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
  MAKEFLAGS: "-j2"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer, Android SDK/NDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            android_app/.buildozer
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-buildozer-api35-py311-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-api35-py311-
            ${{ runner.os }}-buildozer-api35-
            ${{ runner.os }}-buildozer-
          save-always: true

      - name: Install Android build dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf automake libtool \
            libffi-dev libssl-dev zlib1g-dev libltdl-dev \
            libncurses5-dev libncursesw5-dev

      - name: Install Buildozer
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Verify toolchain and cache paths
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python --version
          java -version
          buildozer --version
          test -f android_app/buildozer.spec
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          printf 'ANDROIDSDK=%s\n' "$ANDROIDSDK"
          printf 'ANDROIDNDK=%s\n' "$ANDROIDNDK"
          printf 'ANDROIDAPI=%s ANDROIDMINAPI=%s NDKAPI=%s\n' "$ANDROIDAPI" "$ANDROIDMINAPI" "$NDKAPI"
          find android_app/.buildozer -maxdepth 5 -type d \( -name 'android-sdk' -o -name 'android-ndk-*' -o -name 'python-for-android' \) -print 2>/dev/null || true

      - name: Build debug APK
        shell: bash
        timeout-minutes: 165
        run: |
          set -euo pipefail
          echo "Starting verbose Buildozer Android build..."
          echo "Build logs are intentionally unbuffered."
          buildozer -v android debug

      - name: Locate APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          find android_app/bin -type f -name "*.apk" -print
          test -n "$(find android_app/bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JammerDetector-Android-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14