name: JammerDetector Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android_app/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: jammerdetector-android-build
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
  ANDROIDAPI: "35"
  ANDROIDMINAPI: "23"
  NDKAPI: "23"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"
  MAKEFLAGS: "-j2"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer and Android toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-buildozer-android-api35-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-android-api35-
            ${{ runner.os }}-buildozer-

      - name: Install Android build dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             build-essential git zip unzip autoconf automake libtool pkg-config             libffi-dev libssl-dev zlib1g-dev cmake libltdl-dev             libncurses5-dev libncursesw5-dev

      - name: Install Buildozer
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Verify toolchain and cache paths
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python --version
          java -version
          buildozer --version
          test -f android_app/buildozer.spec
          printf 'ANDROIDSDK=%s\n' "$ANDROIDSDK"
          printf 'ANDROIDAPI=%s ANDROIDMINAPI=%s NDKAPI=%s\n' "$ANDROIDAPI" "$ANDROIDMINAPI" "$NDKAPI"
          if [ -d "$HOME/.buildozer/android/platform/android-sdk" ]; then
            echo "Cached Android SDK directory is present."
          else
            echo "Android SDK directory will be provisioned by Buildozer."
          fi
          find "$HOME/.buildozer/android/platform" -maxdepth 1 -type d -name 'android-ndk-*' -print 2>/dev/null || true

      - name: Build debug APK
        shell: bash
        timeout-minutes: 100
        run: |
          set -euo pipefail
          echo "Starting verbose Buildozer Android build..."
          echo "Build logs are intentionally unbuffered."
          buildozer -v android debug

      - name: Locate APK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          find android_app/bin -type f -name "*.apk" -print
          test -n "$(find android_app/bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JammerDetector-Android-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
