name: JammerDetector Network Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      simulate_blackout:
        description: "Simulate a -140 dBm blackout and send a CRITICAL alert"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jammerdetector-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Network Health Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THINGSPEAK_CHANNEL_ID: ${{ secrets.THINGSPEAK_CHANNEL_ID }}
      THINGSPEAK_WRITE_API_KEY: ${{ secrets.THINGSPEAK_WRITE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check optional secrets (non-blocking)
        shell: bash
        run: |
          set -u
          missing=0
          for name in THINGSPEAK_CHANNEL_ID THINGSPEAK_WRITE_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::$name is not configured; the related integration will be disabled."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All integration secrets are available." || echo "Continuing safely with missing optional secrets."
      - name: Run JammerDetector
        shell: bash
        env:
          SIGNAL_SOURCE: mock
          MOCK_SIGNAL_DROP: ${{ inputs.simulate_blackout || false }}
        run: |
          set -euo pipefail
          python main.py
